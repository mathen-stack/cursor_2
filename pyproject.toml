[project]
name = "nxd-tutorials"
version = "0.1.0"
description = "Nextdata OS onboarding tutorials — multi-channel-sales build series"
requires-python = ">=3.11"
dependencies = [
    "nxd-core",
    "nxd-drivers",
    "nxd-data-product",
]

[[tool.uv.index]]
name = "nxd"
url = "https://nxd.partner.nextopia.dev/registry/index/"

[dependency-groups]
databricks = ["pyspark>=4.0.0"]
dev = [
    "pandas-stubs<=2.1.4",
    "pyright>=1.1.403",
    "ruff>=0.12.8",
]

[tool.ruff]
extend-exclude = ["*.pyi"]
include = ["./**/*.py"]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
